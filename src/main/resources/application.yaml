spring:
  application:
    name: gen-ai-sb
  ai:
    openai:
      api-key: dummy #${OPENAI_API_KEY}
      base-url: http://localhost:12434/engines/v1
      chat:
        options:
          model: docker.io/ai/gemma3:4b #gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b
          temperature: 0.7

server:
  port: 8083

logging:
  level:
    root: INFO
    com.mypractice.genai: INFO
    com.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor: DEBUG


