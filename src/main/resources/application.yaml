spring:
  application:
    name: gen-ai-sb
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        option:
          model: gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b
          temperature: 0.7

server:
  port: 8083

logging:
  level:
    root: INFO
    com.mypractice.genai: INFO
    com.springframework.ai: INFO


